<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IZEKAI HUD Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-hud: #e3ddd3;
            --bg-pill: #f4f0ea;
            --color-text: #594a4e;
            --color-purple: #7a669f;
            --color-brown: #a06034;
            --color-green: #527e77;
            --color-orange: #f49b5c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: repeating-linear-gradient(
                90deg,
                #d3c8ba,
                #d3c8ba 4px,
                #c4b6a6 4px,
                #c4b6a6 8px
            ); /* Ribbed background to match screenshot */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
        }

        /* CONTAINER FOR HUD & HIDE BUTTON */
        .hud-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hud-wrapper.hidden {
            transform: translateY(-150px);
        }

        /* MAIN HUD BAR */
        .hud-bar {
            background-color: var(--bg-hud);
            border-radius: 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 25px 5px 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15), inset 0 2px 5px rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.4);
            width: 850px;
            position: relative;
        }

        /* LEFT: PROFILE */
        .hud-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-pic-wrap {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--color-purple);
        }

        .lvl-badge {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-purple);
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1.5px solid var(--bg-hud);
            white-space: nowrap;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .username {
            font-weight: 800;
            color: var(--color-purple);
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .xp-bar-container {
            width: 70px;
            height: 6px;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        .xp-fill {
            width: 40%;
            height: 100%;
            background: var(--color-brown);
            border-radius: 10px;
        }

        /* CENTER: STATS PILL */
        .hud-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .stat-pill {
            background: var(--bg-pill);
            border-radius: 30px;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 25px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 800;
            color: var(--color-text);
        }

        .stat-item i {
            font-size: 14px;
        }

        .stat-item.coin i { color: var(--color-brown); }
        .stat-item.energy i { color: var(--color-purple); }

        .bar-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 10px;
        }

        .stat-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-bar i { font-size: 12px; }

        .mini-progress-wrap {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .mini-pct {
            font-size: 9px;
            font-weight: 800;
            color: var(--color-text);
            text-align: right;
            line-height: 1;
        }

        .mini-bar {
            width: 35px;
            height: 5px;
            background: rgba(0,0,0,0.08);
            border-radius: 5px;
            overflow: hidden;
        }

        .mini-fill {
            height: 100%;
            border-radius: 5px;
        }

        /* RIGHT: TIME */
        .hud-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text);
            cursor: pointer;
            transition: 0.2s;
        }
        
        .user-btn:hover {
            background: var(--color-text);
            color: var(--bg-hud);
        }

        .time-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.2;
        }

        .day-text {
            font-weight: 800;
            color: var(--color-brown);
            font-size: 13px;
        }

        .clock-text {
            font-weight: 600;
            color: var(--color-text);
            font-size: 12px;
            opacity: 0.8;
        }

        /* SIDE HIDE BUTTON */
        .btn-hide-side {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-hud);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--color-text);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .btn-hide-side:hover {
            transform: scale(1.1);
        }
        
        .btn-hide-side i {
            transition: transform 0.4s ease;
        }

        .hud-wrapper.hidden .btn-hide-side i {
            transform: rotate(180deg);
        }
        
        /* Floating notification slot for demonstration */
        .hud-notif-slot {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-hud);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            color: var(--color-text);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .hud-notif-slot.show {
            bottom: -20px;
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <div class="hud-wrapper" id="hudWrapper">
        <!-- THE HUD BAR -->
        <div class="hud-bar">
            <!-- LEFT -->
            <div class="hud-left">
                <div class="profile-pic-wrap">
                    <img src="https://i.pravatar.cc/150?img=9" alt="ISAGI" class="profile-pic">
                    <div class="lvl-badge">Lvl 5</div>
                </div>
                <div class="profile-info">
                    <div class="username">ISAGI</div>
                    <div class="xp-bar-container">
                        <div class="xp-fill"></div>
                    </div>
                </div>
            </div>

            <!-- CENTER -->
            <div class="hud-center">
                <div class="stat-pill">
                    <div class="stat-item coin">
                        <i class="fa-solid fa-coins"></i> 2,500
                    </div>
                    <div class="stat-item energy">
                        <i class="fa-solid fa-bolt"></i> 15
                    </div>

                    <div class="bar-group">
                        <div class="stat-bar">
                            <i class="fa-solid fa-bolt" style="color: var(--color-green)"></i>
                            <div class="mini-progress-wrap">
                                <div class="mini-pct">80%</div>
                                <div class="mini-bar">
                                    <div class="mini-fill" style="width: 80%; background: var(--color-green);"></div>
                                </div>
                            </div>
                        </div>

                        <div class="stat-bar">
                            <i class="fa-solid fa-utensils" style="color: var(--color-orange)"></i>
                            <div class="mini-progress-wrap">
                                <div class="mini-pct">45%</div>
                                <div class="mini-bar">
                                    <div class="mini-fill" style="width: 45%; background: var(--color-orange);"></div>
                                </div>
                            </div>
                        </div>

                        <div class="stat-bar">
                            <i class="fa-solid fa-droplet" style="color: var(--color-purple)"></i>
                            <div class="mini-progress-wrap">
                                <div class="mini-pct">92%</div>
                                <div class="mini-bar">
                                    <div class="mini-fill" style="width: 92%; background: var(--color-purple);"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT -->
            <div class="hud-right">
                <div class="user-btn">
                    <i class="fa-regular fa-user"></i>
                </div>
                <div class="time-info">
                    <div class="day-text">Day 22</div>
                    <div class="clock-text">10:38 PM • Friday</div>
                </div>
            </div>
            
            <div class="hud-notif-slot" id="hudNotif">
                <i class="fa-solid fa-gift me-2" style="color: var(--color-orange)"></i> Item baru ditambahkan!
            </div>
        </div>

        <!-- HIDE BUTTON ON THE SIDE -->
        <button class="btn-hide-side" onclick="toggleHud()" title="Sembunyikan HUD">
            <i class="fa-solid fa-chevron-up"></i>
        </button>
    </div>

    <!-- DEMO CONTROLS -->
    <div style="margin-top: 100px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center;">
        <h3 style="margin-top:0; color: var(--color-text);">Demo Controls</h3>
        <button onclick="toggleHud()" style="padding: 10px 20px; border: none; background: var(--color-purple); color: white; border-radius: 10px; cursor: pointer; font-family: 'Outfit'; font-weight: 600; margin-right: 10px;">Toggle Hide/Show HUD</button>
        <button onclick="showNotif()" style="padding: 10px 20px; border: none; background: var(--color-orange); color: white; border-radius: 10px; cursor: pointer; font-family: 'Outfit'; font-weight: 600;">Test Notifikasi Bawah</button>
    </div>

    <script>
        function toggleHud() {
            const wrapper = document.getElementById('hudWrapper');
            wrapper.classList.toggle('hidden');
        }
        
        function showNotif() {
            const notif = document.getElementById('hudNotif');
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
