name: DB Keepalive Ping

on:
  schedule:
    # Setiap 5 menit — format cron GitHub Actions (UTC)
    # GitHub Actions minimum interval adalah 5 menit
    - cron: '*/5 * * * *'
  workflow_dispatch: # Bisa juga di-run manual dari GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel to keep Aiven DB alive
        run: |
          echo "Pinging https://marimacha.vercel.app/ping ..."
          RESPONSE=$(curl -s -o /tmp/response.txt -w "%{http_code}" https://marimacha.vercel.app/ping)
          BODY=$(cat /tmp/response.txt)
          echo "HTTP Status: $RESPONSE"
          echo "Response: $BODY"
          if [ "$RESPONSE" != "200" ]; then
            echo "Warning: ping returned non-200 status $RESPONSE"
          else
            echo "Keepalive OK"
          fi
